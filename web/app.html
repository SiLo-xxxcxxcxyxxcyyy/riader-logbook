<title>Raider Logbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky tab bar over a single working column; each tab is a tool surface, map + list side by side on wide screens. */
:root{
  --bg:#12161b; --panel:#1a2027; --panel2:#222a33; --line:#2e3843; --fg:#e4e8ec; --mut:#8b97a3;
  --accent:#f2a531; --accent-ink:#1b1305;
  --keep:#5fb3e8; --sell:#7cc576; --recycle:#d9b44a; --gear:#b49af0; --warn:#ef6b5b;
  --f-disp:"Chakra Petch","Bahnschrift","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef1f3; --panel:#ffffff; --panel2:#f3f5f7; --line:#d4dbe1; --fg:#151b21; --mut:#5b6773;
  --accent:#c77a00; --accent-ink:#fff8ec;
  --keep:#1f78b4; --sell:#2f8a2a; --recycle:#8f6c00; --gear:#6b4cc4; --warn:#c23b2b; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1f3; --panel:#ffffff; --panel2:#f3f5f7; --line:#d4dbe1; --fg:#151b21; --mut:#5b6773;
  --accent:#c77a00; --accent-ink:#fff8ec;
  --keep:#1f78b4; --sell:#2f8a2a; --recycle:#8f6c00; --gear:#6b4cc4; --warn:#c23b2b; color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--mut);letter-spacing:.08em}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{font-family:var(--f-disp);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;background:none;border:1px solid transparent;color:var(--mut);padding:6px 12px;border-radius:4px;cursor:pointer}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{color:var(--accent-ink);background:var(--accent)}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.02em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.btn{font:inherit;font-size:13px;font-weight:500;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{font-size:12px;padding:2px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0}
input[type=number]{width:72px;font-family:var(--f-mono)}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.v-keep{color:var(--keep)} .v-sell{color:var(--sell)} .v-recycle{color:var(--recycle)} .v-gear,.v-learn{color:var(--gear)} .v-mat{color:var(--mut)}
.chip{font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.map{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.itemlink{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.itemlink:hover{text-decoration-color:var(--accent)}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{font-family:var(--f-mono);font-size:12px;background:none;border:1px solid var(--line);color:var(--mut);padding:3px 10px;border-radius:3px;cursor:pointer}
.filters button[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
table{border-collapse:collapse;width:100%}
.tbl{overflow-x:auto}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.thumb{width:28px;height:28px;object-fit:contain;vertical-align:middle;border-radius:3px;background:var(--panel2)}
.r-Common{border-left:3px solid #8a949e}.r-Uncommon{border-left:3px solid #4fa64a}.r-Rare{border-left:3px solid #3f8fd6}.r-Epic{border-left:3px solid #a45ad8}.r-Legendary{border-left:3px solid #e0a020}

/* lobby */
.maprank{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.mapcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:2px}
.mapcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mapcard .n{font-family:var(--f-disp);font-weight:600;font-size:15px}
.mapcard .big{font-family:var(--f-disp);font-size:28px;font-weight:700;line-height:1;color:var(--accent)}
.mapcard.best .n::after{content:"  ▸ best pick";font-family:var(--f-mono);font-size:10px;color:var(--accent);letter-spacing:.06em}
.quest{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.quest:first-child{border-top:0;padding-top:0}
.quest h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qdot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--bg)}
ol.obj{margin:0;padding-left:20px} ol.obj li{margin:2px 0}
.mapbox{position:relative;width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);cursor:crosshair;user-select:none}
.mapbox img{display:block;width:100%;height:auto;max-width:100%}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:3px solid;background:transparent;pointer-events:none;box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.pin span{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;white-space:nowrap;font-family:var(--f-mono);font-size:10px;background:rgba(0,0,0,.75);color:#fff;padding:0 4px;border-radius:2px}
.empty{padding:28px 16px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:6px}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:0;width:min(640px,calc(100vw - 32px));max-height:85vh}
dialog::backdrop{background:rgba(5,8,12,.6)}
dialog .hd{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
dialog .bd{padding:16px;display:flex;flex-direction:column;gap:14px;overflow-wrap:anywhere}
dialog img.big{width:56px;height:56px;object-fit:contain;background:var(--panel2);border-radius:4px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}
.kv dt{color:var(--mut);font-size:13px} .kv dd{margin:0}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.note{font-size:13px;color:var(--mut);border-left:2px solid var(--line);padding-left:10px}
.sum{display:flex;gap:20px;flex-wrap:wrap}
.sum div{display:flex;flex-direction:column}
.sum b{font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:4px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:no-preference){.mapcard,.btn{transition:border-color .15s}}
.grid2.big{grid-template-columns:minmax(0,1fr)}.grid2.big .mappanel{order:-1}
.steps-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.steps-g figure{margin:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.steps-g img{width:100%;border-radius:4px;border:1px solid var(--line);background:var(--panel2)}
.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.tree{grid-template-columns:minmax(0,1fr)}}
.sk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:6px 0;border-top:1px solid var(--line)}
.sk:first-of-type{border-top:0}
.sk .nm{font-weight:500}.sk.off .nm{color:var(--mut)}
.sk .ds{grid-column:1/-1;font-size:12px;color:var(--mut)}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:10px;height:10px;border:1px solid var(--line);border-radius:2px;display:inline-block}
.pips i.plan{border-color:var(--accent)} .pips i.on{background:var(--accent);border-color:var(--accent)}
.gate{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.steps{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;gap:8px;align-items:baseline}
.steps li.done{color:var(--mut)} .steps li.done .mono{text-decoration:line-through}
.nextbox li{padding:6px 0;border-top:1px solid var(--line)} .nextbox li:first-child{border-top:0}
footer.foot{padding-block:0 40px;font-size:12px;color:var(--mut)}
footer.foot a{color:var(--mut)}
input[type=range]{accent-color:var(--accent);flex:1;min-width:160px}
.desk-only{display:none} body.desk .desk-only{display:revert}
body.desk .web-only{display:none}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 6px;background:var(--panel2)}
.scanlist{max-height:320px;overflow:auto}
.conf{font-family:var(--f-mono);font-size:11px;color:var(--mut)}
.conf.low{color:var(--warn)}
</style>

<header class="top"><div class="wrap">
  <div class="brand">Raider Logbook</div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="lobby">Lobby</button>
    <button role="tab" data-tab="vault">Vault</button>
    <button role="tab" data-tab="quests">Quests</button>
    <button role="tab" data-tab="needs">Shopping list</button>
    <button role="tab" data-tab="items">Items</button>
    <button role="tab" data-tab="skills">Skills</button>
    <button role="tab" data-tab="scan">Scan</button>
    <button role="tab" data-tab="help">Help</button>
  </nav>
</div></header>

<main class="wrap" id="main"></main>
<footer class="wrap foot" id="foot"></footer>

<dialog id="dlg"><div class="hd"><img class="big" id="dlgImg" alt="" onerror="this.hidden=true"><div style="flex:1;min-width:0"><div class="eyebrow" id="dlgSub"></div><h2 id="dlgTitle"></h2></div><button class="btn" id="dlgClose">Close</button></div><div class="bd" id="dlgBody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
const D=/*__DATA__*/null, MAPIMG=/*__MAPS__*/null;
const MAPN={...D.maps,stella_montis:"Stella Montis"};
const QMAP_TO_IMG={stella_montis:["stella_montis_upper","stella_montis_lower"]};
const COLORS=["#f2a531","#5fb3e8","#e8607a","#7cc576","#b49af0","#4fd1c5","#f07b3f","#d6d04a"];
const GEAR=new Set(["Assault Rifle","SMG","Pistol","Shotgun","Battle Rifle","Sniper Rifle","LMG","Hand Cannon","Augment","Shield","Quick Use","Ammunition","Modification"]);
const MATS=new Set(["Basic Material","Refined Material","Topside Material","Nature"]);

/* ---------- state ---------- */
const KEY="raider-logbook-v1";
const S=Object.assign({inv:{},done:{},hide:{},proj:{},useProj:false,future:true,pins:{},tab:"lobby",lobbyMap:null,qf:"avail",vf:"all",scan:null},(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I=id=>D.items[id]||{n:id.replace(/_/g," ")};
const nm=id=>I(id).n;
const fmt=n=>Number(n).toLocaleString("en-US");
const plural=(n,w)=>`${n} ${w}${n===1?"":"s"}`;
const have=id=>S.inv[id]||0;
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
const itemBtn=(id,label)=>`<button class="itemlink" data-item="${esc(id)}">${esc(label??nm(id))}</button>`;
const thumb=id=>I(id).img?`<img class="thumb" loading="lazy" src="${esc(I(id).img)}" alt="" onerror="this.style.visibility='hidden'">`:"";
let DESK=false;
const api=()=>window.pywebview&&window.pywebview.api;

/* ---------- quests ---------- */
const Q=D.quests;
const qStatus=id=>S.done[id]?"done":((Q[id].pre||[]).filter(p=>Q[p]).every(p=>S.done[p])?"avail":"locked");
const qColor={};Object.keys(Q).sort().forEach((id,i)=>qColor[id]=COLORS[i%COLORS.length]);
function ancestors(id,acc=new Set()){(Q[id]?.pre||[]).forEach(p=>{if(Q[p]&&!acc.has(p)){acc.add(p);ancestors(p,acc)}});return acc}

/* ---------- needs ---------- */
let NEEDS=null;
function computeNeeds(){
  const N={};const add=(it,q,src,kind)=>{(N[it]=N[it]||[]).push({q,src,kind})};
  for(const[id,q]of Object.entries(Q)){const st=qStatus(id);if(st==="done")continue;if(st==="locked"&&!S.future)continue;
    for(const[it,n]of Object.entries(q.req||{}))add(it,n,`Quest: ${q.n}`,st==="avail"?"qa":"qf")}
  for(const[id,h]of Object.entries(D.hideout)){const cur=S.hide[id]||0;
    for(const[lv,r]of Object.entries(h.lv)){if(+lv<=cur)continue;for(const[it,n]of Object.entries(r))add(it,n,`${h.n} lvl ${lv}`,+lv===cur+1?"ha":"hf")}}
  if(S.useProj)for(const[id,p]of Object.entries(D.projects)){const cur=S.proj[id]||0;
    p.ph.forEach((ph,i)=>{if(i<cur)return;for(const[it,n]of Object.entries(ph.req))add(it,n,`Project: ${p.n} – phase ${i+1}`,"p")})}
  NEEDS=N;
}
const needTotal=id=>(NEEDS[id]||[]).reduce((a,b)=>a+b.q,0);
const deficit=id=>Math.max(0,needTotal(id)-have(id));
const RECIPE_USE={};for(const[id,it]of Object.entries(D.items))for(const m of Object.keys(it.rp||{}))(RECIPE_USE[m]=RECIPE_USE[m]||[]).push(id);

function verdict(id,count){
  const it=I(id),n=needTotal(id),keep=Math.min(count,n),extra=count-keep;
  const base={keep,extra,n};
  if(count===0)return{...base,k:n?"recycle":"mat",label:n?"Wanted":"None",why:n?`You need ${n}, you have none`:"Not in your vault"};
  if(extra<=0)return{...base,k:"keep",label:"Keep",why:count<n?`Keep all, you still need ${n-count} more`:"You need all of them"};
  const pre=keep>0?`Keep ${keep}, then `:"";
  if(S.use&&S.use[id])return{...base,k:"keep",label:"Keep",why:keep>0?`Keep: needed for ${keep} and you use it`:"You use it in your loadout"};
  if(it.t==="Blueprint")return{...base,k:"learn",label:"Learn",why:pre+"learn the blueprint first, sell duplicates"};
  if(it.t==="Key")return{...base,k:"gear",label:"Key",why:pre+"use it in a raid or sell it"};
  if(GEAR.has(it.t)||/weapon/i.test(it.t||""))return{...base,k:"gear",label:"Gear",why:pre+"sell it unless it's in your loadout (mark it in the item)"};
  const rc=Object.keys(it.rc||{}).filter(m=>deficit(m)>0);
  if(rc.length)return{...base,k:"recycle",label:"Recycle",why:pre+"recycle it for "+rc.map(m=>`${it.rc[m]}× ${nm(m)}`).join(", "),rc};
  if(MATS.has(it.t)&&RECIPE_USE[id])return{...base,k:"mat",label:"Material",why:pre+`used in ${plural(RECIPE_USE[id].length,"recipe")}, keep a sensible stock`};
  return{...base,k:"sell",label:"Sell",why:pre+`nothing needs it · ${fmt(extra*(it.v||0))} creds`};
}

/* ---------- where to find ---------- */
function sources(id){
  const it=I(id),out={};
  out.zones=it.f?it.f.split(",").map(s=>s.trim()):[];
  out.bots=D.bots.filter(b=>b.drops.includes(id));
  out.from=Object.entries(D.items).map(([k,x])=>({id:k,rc:(x.rc||{})[id]||0,sv:(x.sv||{})[id]||0})).filter(x=>x.rc||x.sv).sort((a,b)=>have(b.id)-have(a.id)||b.rc-a.rc).slice(0,10);
  out.vendors=it.vd||[];
  out.trades=D.trades.filter(t=>t.it===id);
  out.quests=Object.entries(Q).filter(([,q])=>(q.rw||{})[id]).map(([k,q])=>({id:k,n:q.n,q:q.rw[id]}));
  return out;
}

function openItem(id){
  const it=I(id),s=sources(id),v=verdict(id,have(id)),needs=NEEDS[id]||[];
  $("#dlgImg").src=it.img||"";$("#dlgImg").hidden=!it.img;
  $("#dlgTitle").textContent=it.n;
  $("#dlgSub").textContent=[it.t,it.r].filter(Boolean).join(" · ");
  const sec=(t,b)=>b?`<section class="stack" style="gap:6px"><div class="eyebrow">${t}</div><div>${b}</div></section>`:"";
  let h=`<div class="row"><span class="pill v-${v.k}">${v.label}</span><span class="mut">${esc(v.why)}</span></div>
  <div class="row"><label for="dlgQty" class="mut">In my vault</label><input type="number" min="0" id="dlgQty" value="${have(id)}"><span class="mono mut">· value ${fmt(it.v||0)} · stack ${it.st??"–"} · ${it.w??"–"} kg</span></div>`;
  h+=sec(`Needed in total: ${needTotal(id)}`,needs.length?`<ul class="plain">${needs.map(n=>`<li><span class="mono">${n.q}×</span> ${esc(n.src)} ${n.kind==="qa"||n.kind==="ha"?'<span class="chip map">now</span>':''}</li>`).join("")}</ul>`:"");
  if(GEAR.has(it.t)||/weapon/i.test(it.t||""))h+=`<label class="row"><input type="checkbox" data-use="${esc(id)}" ${S.use&&S.use[id]?"checked":""}> I use this in my loadout (always keep it)</label>`;
  const gl=(D.guides||[]).filter(g=>g.items.includes(id));
  const where=[];
  if(s.zones.length)where.push(`<li>Loot it in <b>${esc(s.zones.join(", "))}</b> zones (marked by loot icons on the map).</li>`);
  s.bots.forEach(b=>where.push(`<li>Dropped by ARC <b>${esc(b.n)}</b> on ${b.maps.map(m=>`<span class="chip map">${esc(MAPN[m]||m)}</span>`).join(" ")}</li>`));
  s.vendors.forEach(x=>where.push(`<li>Sold by <b>${esc(x.tr)}</b> for ${Object.entries(x.c||{}).map(([k,n])=>`${fmt(n)} ${k==="creds"?"creds":esc(nm(k))}`).join(", ")}</li>`));
  s.trades.forEach(t=>where.push(`<li>Trade with <b>${esc(t.tr)}</b>: ${t.c.quantity}× ${itemBtn(t.c.itemId)} → ${t.q}×</li>`));

/* pan / zoom / click */
(()=>{let drag=null;
  const zoomAt=(f,cx,cy)=>{const T=window.__tx;if(!T)return;const vw=T.vw;const wx=vw.cx+(cx-T.W/2)/T.sc,wy=vw.cy+(cy-T.H/2)/T.sc;vw.z=Math.min(12,Math.max(1,vw.z*f));const sc=T.fit*vw.z;vw.cx=wx-(cx-T.W/2)/sc;vw.cy=wy-(cy-T.H/2)/sc;clampV();drawTactical();save()};
  const clampV=()=>{const T=window.__tx;if(!T)return;const vw=T.vw,hw=T.W/2/(T.fit*vw.z),hh=T.H/2/(T.fit*vw.z);vw.cx=Math.min(Math.max(vw.cx,hw),T.Wd.W-hw);vw.cy=Math.min(Math.max(vw.cy,hh),T.Wd.H-hh)};
  window.__zoom=(d)=>{const T=window.__tx;if(!T)return;if(d===0){T.vw.z=1;T.vw.cx=T.Wd.W/2;T.vw.cy=T.Wd.H/2;drawTactical();save();return}zoomAt(d>0?1.6:1/1.6,T.W/2,T.H/2)};
  window.__focus=(pts,m)=>{const v=viewOf(m),Wd=world(m),ws=pts.map(p=>Wd.toW(p));const xs=ws.map(w=>w[0]),ys=ws.map(w=>w[1]);
    const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);v.cx=(x0+x1)/2;v.cy=(y0+y1)/2;v.z=Math.min(6,Math.max(1.5,0.6*Math.min(Wd.W/Math.max(x1-x0,1),Wd.H/Math.max(y1-y0,1))))};
  document.addEventListener("wheel",e=>{if(e.target.id!=="tmap")return;e.preventDefault();const r=e.target.getBoundingClientRect();zoomAt(e.deltaY<0?1.25:0.8,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  const ptrs=new Map();
  document.addEventListener("pointerdown",e=>{if(e.target.id!=="tmap")return;e.target.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);const T=window.__tx;drag={x:e.clientX,y:e.clientY,cx:T.vw.cx,cy:T.vw.cy,moved:0,pinch:ptrs.size===2?null:undefined}});
  document.addEventListener("pointermove",e=>{if(!drag||e.target.id!=="tmap")return;const T=window.__tx;
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(drag.pinch){const r=e.target.getBoundingClientRect();zoomAt(d/drag.pinch,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top)}drag.pinch=d;drag.moved=99;return}
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved=Math.max(drag.moved,Math.hypot(dx,dy));if(drag.moved<4)return;
    T.vw.cx=drag.cx-dx/T.sc;T.vw.cy=drag.cy-dy/T.sc;clampV();drawTactical()});
  document.addEventListener("pointerup",e=>{ptrs.delete(e.pointerId);if(!drag||e.target.id!=="tmap"){drag=null;return}const moved=drag.moved;drag=null;save();if(moved>=4)return;
    const T=window.__tx,r=e.target.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top,m=S.lobbyMap,Wd=world(m);
    const wx=T.vw.cx+(cx-T.W/2)/T.sc,wy=T.vw.cy+(cy-T.H/2)/T.sc;
    // world -> marker coords (inverse of toW)
    const v=mapView(m);let mx,my;if(v){mx=(wx-v.a.tx)/v.a.s;my=(wy-v.a.ty)/v.a.s}else{const[x0,y0,x1]=mkFor(m).box,pad=(x1-x0)*0.04;mx=wx+x0-pad;my=wy+y0-pad}
    S.tpins=S.tpins||{};const list=S.tpins[m]=S.tpins[m]||[];
    const hit=list.findIndex(p=>{const[a,b]=Wd.toW([p.x,p.y]);return Math.hypot(T.W/2+(a-T.vw.cx)*T.sc-cx,T.H/2+(b-T.vw.cy)*T.sc-cy)<12});
    if(hit>=0)list.splice(hit,1);else list.push({x:Math.round(mx),y:Math.round(my),l:"marker"});drawTactical();save()});
})();

/* ---------- scan results ---------- */
window.onScanResult=r=>{
  if(!r){return}
  if(r.error){S.scan={kind:"error",...r};S.tab="scan";render();toast("Nothing recognised");return}
  if(r.kind==="quests")r.quests.forEach(q=>q.use=q.score>=90);
  S.scan=r;S.tab="scan";render();
  toast(r.kind==="quests"?`${plural(r.quests.length,"quest")} recognised`:r.kind==="vault"?`${plural(r.items.length,"item type")} recognised`:"Nothing recognised");
};
function questScanTarget(replace){
  const ids=S.scan.quests.filter(q=>q.use!==false).map(q=>q.id),done=replace?{}:{...S.done};
  ids.forEach(id=>ancestors(id).forEach(a=>done[a]=true));ids.forEach(id=>delete done[id]);return done;
}
function questScanPreview(){const t=questScanTarget(true);return{done:Object.keys(t).length,undone:Object.keys(S.done).filter(k=>!t[k]).length}}
function snapshotDone(){S.doneUndo=JSON.parse(JSON.stringify(S.done))}
function applyQuests(replace){
  if(!S.scan.quests.some(q=>q.use!==false)){toast("Tick at least one quest");return}
  snapshotDone();S.done=questScanTarget(replace);
  S.scan=null;S.tab="lobby";render();toast("Quest progress updated. Undo it on the Quests tab.");
}
function descendants(id,acc=new Set()){(Q[id]?.nx||[]).forEach(n=>{if(Q[n]&&!acc.has(n)){acc.add(n);descendants(n,acc)}});return acc}
function applyVault(replace){
  if(replace)S.inv={};
  S.scan.items.forEach(x=>{if(x.count>0)S.inv[x.id]=(replace?0:(S.inv[x.id]||0))+x.count});
  S.scan=null;api()&&api().reset_vault_session();S.tab="vault";render();toast("Vault updated");
}

  else if(d.vf){S.vf=d.vf;render()}

  else if(t.id==="addBtn")addItem();
  else if(t.id==="sampleInv"){Object.assign(S.inv,{rusted_gear:6,metal_parts:40,fabric:12,plastic_parts:30,dusty_film_reel:1,acoustic_guitar:1,advanced_arc_powercell:2,wasp_driver:3,adrenaline_shot:5,shotgun_silencer_blueprint:1,air_freshener:2,cat_bed:1,coffee_pot:1});render();toast("Example vault loaded")}

  else if(t.id==="bkCopy"){const v=$("#bk").value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast("Copied"),()=>{$("#bk").select()})}
  else if(t.id==="bkImport"){try{Object.assign(S,JSON.parse($("#bk").value));render();toast("Backup restored")}catch(_){toast("That backup isn't valid JSON")}}
  else if(t.id==="scanNow"&&api()){toast("Scanning…");api().scan_screen().then(window.onScanResult)}
  else if(t.id==="scanFile"&&api()){api().scan_file().then(window.onScanResult)}

  else if(t.id==="applyQuestsAdd")applyQuests(false);
  else if(t.id==="openScans"&&api())api().open_scans_folder();
  else if(t.id==="undoQuests"&&S.doneUndo){S.done=S.doneUndo;S.doneUndo=null;render();toast("Quest progress restored")}
  else if(t.id==="resetQuests"){if(t.dataset.arm){snapshotDone();S.done={};render();toast("All quests reset. Undo is available.")}else{t.dataset.arm=1;t.textContent="Reset every quest?"}}
  else if(d.undoneafter){snapshotDone();delete S.done[d.undoneafter];descendants(d.undoneafter).forEach(x=>delete S.done[x]);render();toast("Reset this quest and everything after it")}
  else if(t.id==="applyVaultReplace")applyVault(true);
  else if(t.id==="applyVaultAdd")applyVault(false);
  else if(t.id==="dropScan"){S.scan=null;render()}
});
function addItem(){const n=$("#addName").value.trim().toLowerCase();const id=BY_NAME[n]||Object.keys(D.items).find(k=>D.items[k].n.toLowerCase().startsWith(n));
  if(!n||!id){toast("No item with that name");return}setQty(id,have(id)+Math.max(1,+$("#addQty").value||1));$("#addName").value="";render();$("#addName").focus();toast(`Added ${nm(id)}`)}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="addName")addItem()});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
  if(d.qty){setQty(d.qty,+t.value);render()}
  else if(d.use){S.use=S.use||{};if(t.checked)S.use[d.use]=1;else delete S.use[d.use];save();openItem(d.use)}
  else if(d.scanq!==undefined){S.scan.quests[+d.scanq].use=t.checked;render()}
  else if(d.scancount!==undefined){S.scan.items[+d.scancount].count=Math.max(0,+t.value||0);save()}
  else if(d.hide){S.hide[d.hide]=+t.value;render()}
  else if(d.proj){S.proj[d.proj]=+t.value;render()}
  else if(t.id==="optFuture"){S.future=t.checked;render()}
  else if(t.id==="optProj"){S.useProj=t.checked;render()}
  else if(t.id==="pinQ"){S.pinQ=t.value;save()}
  else if(t.id==="routeT"){S.routeT=t.value;render()}
  else if(t.id==="showRoute"){S.showRoute=t.checked;render()}
  else if(t.id==="it"){S.it=t.value;render()}
  else if(t.id==="skPtsN"||t.id==="skPts"){S.skillPts=+t.value;render()}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="skPts"){const n=$("#skPtsN");if(n)n.value=t.value}
  else if(t.id==="qs"){S.qs=t.value;render()} else if(t.id==="is"){S.is=t.value;render()}});
window.addEventListener("resize",()=>drawTactical());
document.addEventListener("click",e=>{const box=e.target.closest("#mapbox");if(!box)return;
  const r=box.getBoundingClientRect();const x=((e.clientX-r.left)/r.width*100).toFixed(2),y=((e.clientY-r.top)/r.height*100).toFixed(2);
  const k=S.lobbyImg||(QMAP_TO_IMG[S.lobbyMap]||[S.lobbyMap])[0];const q=$("#pinQ")?.value||"";
  (S.pins[k]=S.pins[k]||[]).push({x:+x,y:+y,q,l:q?"":"marker"});render()});
document.addEventListener("toggle",e=>{if(e.target.id==="skOrderBox"){S.skOrder=e.target.open;save()}
  const gid=e.target.dataset&&e.target.dataset.g;if(gid){S.gOpen=S.gOpen||{};const was=!!S.gOpen[gid];if(e.target.open)S.gOpen[gid]=1;else delete S.gOpen[gid];save();if(e.target.open&&!was)render()}},true);
{const m=D.meta;if(m)$("#foot").innerHTML=`Data updated ${esc(new Date(m.built).toLocaleString())} from ${m.sources.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.n)}</a> (${esc(x.what)})`).join(", ")}. Not affiliated with Embark Studios.`}
window.addEventListener("pywebviewready",()=>{DESK=true;document.body.classList.add("desk");render()});
const h=(location.hash||"").slice(1);if(V[h])S.tab=h;
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(V[h]&&h!==S.tab){S.tab=h;render()}});
render();
</script>
