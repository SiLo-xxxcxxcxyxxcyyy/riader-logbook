<title>Raider Logbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky tab bar over a single working column; each tab is a tool surface, map + list side by side on wide screens. */
:root{
  --bg:#12161b; --panel:#1a2027; --panel2:#222a33; --line:#2e3843; --fg:#e4e8ec; --mut:#8b97a3;
  --accent:#f2a531; --accent-ink:#1b1305;
  --keep:#5fb3e8; --sell:#7cc576; --recycle:#d9b44a; --gear:#b49af0; --warn:#ef6b5b;
  --f-disp:"Chakra Petch","Bahnschrift","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef1f3; --panel:#ffffff; --panel2:#f3f5f7; --line:#d4dbe1; --fg:#151b21; --mut:#5b6773;
  --accent:#c77a00; --accent-ink:#fff8ec;
  --keep:#1f78b4; --sell:#2f8a2a; --recycle:#8f6c00; --gear:#6b4cc4; --warn:#c23b2b; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1f3; --panel:#ffffff; --panel2:#f3f5f7; --line:#d4dbe1; --fg:#151b21; --mut:#5b6773;
  --accent:#c77a00; --accent-ink:#fff8ec;
  --keep:#1f78b4; --sell:#2f8a2a; --recycle:#8f6c00; --gear:#6b4cc4; --warn:#c23b2b; color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--mut);letter-spacing:.08em}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{font-family:var(--f-disp);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;background:none;border:1px solid transparent;color:var(--mut);padding:6px 12px;border-radius:4px;cursor:pointer}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{color:var(--accent-ink);background:var(--accent)}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.02em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.btn{font:inherit;font-size:13px;font-weight:500;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{font-size:12px;padding:2px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0}
input[type=number]{width:72px;font-family:var(--f-mono)}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.v-keep{color:var(--keep)} .v-sell{color:var(--sell)} .v-recycle{color:var(--recycle)} .v-gear,.v-learn{color:var(--gear)} .v-mat{color:var(--mut)}
.chip{font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.map{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.itemlink{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.itemlink:hover{text-decoration-color:var(--accent)}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{font-family:var(--f-mono);font-size:12px;background:none;border:1px solid var(--line);color:var(--mut);padding:3px 10px;border-radius:3px;cursor:pointer}
.filters button[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
table{border-collapse:collapse;width:100%}
.tbl{overflow-x:auto}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.thumb{width:28px;height:28px;object-fit:contain;vertical-align:middle;border-radius:3px;background:var(--panel2)}
.r-Common{border-left:3px solid #8a949e}.r-Uncommon{border-left:3px solid #4fa64a}.r-Rare{border-left:3px solid #3f8fd6}.r-Epic{border-left:3px solid #a45ad8}.r-Legendary{border-left:3px solid #e0a020}

/* lobby */
.maprank{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.mapcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:2px}
.mapcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mapcard .n{font-family:var(--f-disp);font-weight:600;font-size:15px}
.mapcard .big{font-family:var(--f-disp);font-size:28px;font-weight:700;line-height:1;color:var(--accent)}
.mapcard.best .n::after{content:"  ▸ best pick";font-family:var(--f-mono);font-size:10px;color:var(--accent);letter-spacing:.06em}
.quest{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.quest:first-child{border-top:0;padding-top:0}
.quest h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qdot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--bg)}
ol.obj{margin:0;padding-left:20px} ol.obj li{margin:2px 0}
.mapbox{position:relative;width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);cursor:crosshair;user-select:none}
.mapbox img{display:block;width:100%;height:auto;max-width:100%}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:3px solid;background:transparent;pointer-events:none;box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.pin span{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;white-space:nowrap;font-family:var(--f-mono);font-size:10px;background:rgba(0,0,0,.75);color:#fff;padding:0 4px;border-radius:2px}
.empty{padding:28px 16px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:6px}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:0;width:min(640px,calc(100vw - 32px));max-height:85vh}
dialog::backdrop{background:rgba(5,8,12,.6)}
dialog .hd{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
dialog .bd{padding:16px;display:flex;flex-direction:column;gap:14px;overflow-wrap:anywhere}
dialog img.big{width:56px;height:56px;object-fit:contain;background:var(--panel2);border-radius:4px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}
.kv dt{color:var(--mut);font-size:13px} .kv dd{margin:0}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.note{font-size:13px;color:var(--mut);border-left:2px solid var(--line);padding-left:10px}
.sum{display:flex;gap:20px;flex-wrap:wrap}
.sum div{display:flex;flex-direction:column}
.sum b{font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:4px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:no-preference){.mapcard,.btn{transition:border-color .15s}}
.scanbar{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px}
.scanbar[hidden]{display:none}
.scanbar .spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;flex:none}
@media (prefers-reduced-motion:no-preference){.scanbar .spin{animation:spin .8s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent)}
.meter.full>i{background:var(--keep)}
.grid2.big{grid-template-columns:minmax(0,1fr)}.grid2.big .mappanel{order:-1}
.steps-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.steps-g figure{margin:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.steps-g img{width:100%;border-radius:4px;border:1px solid var(--line);background:var(--panel2)}
.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.tree{grid-template-columns:minmax(0,1fr)}}
.sk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:6px 0;border-top:1px solid var(--line)}
.sk:first-of-type{border-top:0}
.sk .nm{font-weight:500}.sk.off .nm{color:var(--mut)}
.sk .ds{grid-column:1/-1;font-size:12px;color:var(--mut)}
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:10px;height:10px;border:1px solid var(--line);border-radius:2px;display:inline-block}
.pips i.plan{border-color:var(--accent)} .pips i.on{background:var(--accent);border-color:var(--accent)}
.gate{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.steps{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;gap:8px;align-items:baseline}
.steps li.done{color:var(--mut)} .steps li.done .mono{text-decoration:line-through}
.nextbox li{padding:6px 0;border-top:1px solid var(--line)} .nextbox li:first-child{border-top:0}
footer.foot{padding-block:0 40px;font-size:12px;color:var(--mut)}
footer.foot a{color:var(--mut)}
input[type=range]{accent-color:var(--accent);flex:1;min-width:160px}
.desk-only{display:none} body.desk .desk-only{display:revert}
body.desk .web-only{display:none}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 6px;background:var(--panel2)}
.scanlist{max-height:320px;overflow:auto}
.conf{font-family:var(--f-mono);font-size:11px;color:var(--mut)}
.conf.low{color:var(--warn)}
</style>

<header class="top"><div class="wrap">
  <div class="brand">Raider Logbook</div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="lobby">Lobby</button>
    <button role="tab" data-tab="vault">Vault</button>
    <button role="tab" data-tab="quests">Quests</button>
    <button role="tab" data-tab="needs">Shopping list</button>
    <button role="tab" data-tab="items">Items</button>
    <button role="tab" data-tab="skills">Skills</button>
    <button role="tab" data-tab="scan">Scan</button>
    <button role="tab" data-tab="help">Help</button>
  </nav>
</div></header>

<main class="wrap" id="main"></main>
<footer class="wrap foot" id="foot"></footer>

<dialog id="dlg"><div class="hd"><img class="big" id="dlgImg" alt="" onerror="this.hidden=true"><div style="flex:1;min-width:0"><div class="eyebrow" id="dlgSub"></div><h2 id="dlgTitle"></h2></div><button class="btn" id="dlgClose">Close</button></div><div class="bd" id="dlgBody"></div></dialog>
<div class="toast" id="toast" hidden></div>
<div class="scanbar" id="scanbar" role="status" aria-live="polite" hidden><span class="spin" aria-hidden="true"></span><span id="scanbarText">Scanning…</span></div>

<script>
const D=/*__DATA__*/null, MAPIMG=/*__MAPS__*/null;
const MAPN={...D.maps,stella_montis:"Stella Montis"};
const QMAP_TO_IMG={stella_montis:["stella_montis_upper","stella_montis_lower"]};
const COLORS=["#f2a531","#5fb3e8","#e8607a","#7cc576","#b49af0","#4fd1c5","#f07b3f","#d6d04a"];
const GEAR=new Set(["Assault Rifle","SMG","Pistol","Shotgun","Battle Rifle","Sniper Rifle","LMG","Hand Cannon","Augment","Shield","Quick Use","Ammunition","Modification"]);
const MATS=new Set(["Basic Material","Refined Material","Topside Material","Nature"]);

/* ---------- state ---------- */
const KEY="raider-logbook-v1";
const S=Object.assign({inv:{},done:{},hide:{},proj:{},future:true,pins:{},tab:"lobby",lobbyMap:null,qf:"mine",vf:"all",scan:null,stockBasic:400,stockMat:50},(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})());
// v2 verdicts: projects (expeditions) count by default; past seasons' expeditions start as complete
if(!S.v2){S.v2=1;S.stockBasic=S.stockBasic||400;S.stockMat=S.stockMat||50;
  for(const p of ["expedition_project_s1","expedition_project","expedition_project_s3","expedition_project_s4"])
    if(D.projects[p]&&S.proj[p]==null)S.proj[p]=D.projects[p].ph.length}
// v3: projects are opt-in. Only the ones you tick are tracked; per project you set the phase you're on and what you've handed in.
if(!S.v3){S.v3=1;S.projT={};S.projGiven={};S.projOpen={}}
S.projT=S.projT||{};S.projGiven=S.projGiven||{};S.projOpen=S.projOpen||{};
// scan thumbnails stay out of storage: hundreds of them could push the whole state past the quota
function save(){try{localStorage.setItem(KEY,JSON.stringify(S,(k,v)=>k==="img"&&typeof v==="string"&&v.startsWith("data:")?undefined:v))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I=id=>D.items[id]||{n:id.replace(/_/g," ")};
const nm=id=>I(id).n;
const fmt=n=>Number(n).toLocaleString("en-US");
const plural=(n,w)=>`${n} ${w}${n===1?"":"s"}`;
const have=id=>S.inv[id]||0;
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
const itemBtn=(id,label)=>`<button class="itemlink" data-item="${esc(id)}">${esc(label??nm(id))}</button>`;
const thumb=id=>I(id).img?`<img class="thumb" loading="lazy" src="${esc(I(id).img)}" alt="" onerror="this.style.visibility='hidden'">`:"";
let DESK=false;
const api=()=>window.pywebview&&window.pywebview.api;

/* ---------- quests ---------- */
const Q=D.quests;
// Quests with no known previous quest (hidden quests, or new ones the data can't place yet) only count
// as available once you have them: scanned, or "I have this quest". The real first quest is the exception.
const needsConfirm=id=>{const q=Q[id];return !(q.pre||[]).some(p=>Q[p])&&(q.hid||q.new)};
const qStatus=id=>S.done[id]?"done":(S.active&&S.active[id])?"avail":needsConfirm(id)?"locked":((Q[id].pre||[]).filter(p=>Q[p]).every(p=>S.done[p])?"avail":"locked");
const qColor={};Object.keys(Q).sort().forEach((id,i)=>qColor[id]=COLORS[i%COLORS.length]);
function ancestors(id,acc=new Set()){(Q[id]?.pre||[]).forEach(p=>{if(Q[p]&&!acc.has(p)){acc.add(p);ancestors(p,acc)}});return acc}

/* ---------- needs ---------- */
let NEEDS=null;
function computeNeeds(){
  const N={};const add=(it,q,src,kind)=>{(N[it]=N[it]||[]).push({q,src,kind})};
  for(const[id,q]of Object.entries(Q)){const st=qStatus(id);if(st==="done")continue;if(st==="locked"&&!S.future)continue;
    for(const[it,n]of Object.entries(q.req||{}))add(it,n,`Quest: ${q.n}`,st==="avail"?"qa":"qf")}
  for(const[id,h]of Object.entries(D.hideout)){const cur=S.hide[id]||0;
    for(const[lv,r]of Object.entries(h.lv)){if(+lv<=cur)continue;for(const[it,n]of Object.entries(r))add(it,n,`${h.n} lvl ${lv}`,+lv===cur+1?"ha":"hf")}}
  for(const id of Object.keys(S.projT)){const p=D.projects[id];if(!p)continue;const cur=S.proj[id]||0,g=S.projGiven[id]||{};
    p.ph.forEach((ph,i)=>{if(i<cur)return;for(const[it,n]of Object.entries(ph.req)){const q=i===cur?Math.max(0,n-(g[it]||0)):n;
      if(q)add(it,q,`Project: ${p.n} – phase ${i+1}`,i===cur?"pa":"p")}})}
  NEEDS=N;
}
const needTotal=id=>(NEEDS[id]||[]).reduce((a,b)=>a+b.q,0);
const deficit=id=>Math.max(0,needTotal(id)-have(id));
const RECIPE_USE={};for(const[id,it]of Object.entries(D.items))for(const m of Object.keys(it.rp||{}))(RECIPE_USE[m]=RECIPE_USE[m]||[]).push(id);
// everything an item is good for besides quests / workshop / projects: crafting recipes, weapon
// upgrades and repairs (MetaForge), and hand-kept notes (sources/item_uses.json)
function uses(id){
  const out=(RECIPE_USE[id]||[]).map(x=>({k:"craft",for:x}));
  for(const[k,f]of(I(id).us||[]))out.push(k==="note"?{k,note:f}:{k,for:f});
  return out;
}
function usesText(id,max=3){
  const u=uses(id);if(!u.length)return"";
  const note=u.find(x=>x.k==="note");if(note)return note.note;
  const names=[...new Set(u.map(x=>nm(x.for).replace(/\s*\(.*\)$/,"").replace(/ Blueprint$/,"")))];
  const kinds=new Set(u.map(x=>x.k));
  const verb=kinds.has("craft")?"crafts":kinds.has("upgrade")?"upgrades":"repairs";
  return `${verb} ${names.slice(0,max).join(", ")}${names.length>max?` and ${names.length-max} more`:""}`;
}
const isGear=it=>GEAR.has(it.t)||WEAPON_T.has(it.t)||/weapon/i.test(it.t||"");
const isBasic=id=>I(id).t==="Basic Material"&&(I(id).r||"Common")==="Common";
// how many of a crafting material you like to have: common basic materials up to S.stockBasic (the
// rest is sold), other materials you craft with are kept, and below S.stockMat you'd rather recycle into them
const stockTarget=id=>isBasic(id)?S.stockBasic:S.stockMat;
// short of it: needed for a quest / upgrade / project, or a crafting material below its stock target
const short=id=>deficit(id)>0||(uses(id).length>0&&!isGear(I(id))&&have(id)<stockTarget(id));

const TRADE_COST={};for(const t of D.trades){const c=t.c&&t.c.itemId;if(c&&c!=="creds"&&c!=="coins"&&D.items[c])(TRADE_COST[c]=TRADE_COST[c]||[]).push(t)}
function verdict(id,count){
  const it=I(id),n=needTotal(id),keep=Math.min(count,n),extra=count-keep;
  const base={keep,extra,n};
  if(count===0)return{...base,k:n?"recycle":"mat",label:n?"Wanted":"None",why:n?`You need ${n}, you have none`:"Not in your vault"};
  if(extra<=0)return{...base,k:"keep",label:"Keep",why:count<n?`Keep all, you still need ${n-count} more`:"You need all of them"};
  const pre=keep>0?`Keep ${keep} for ${(NEEDS[id]||[]).map(x=>x.src.replace(/^Quest: /,"")).slice(0,2).join(", ")}, then `:"";
  if(S.use&&S.use[id])return{...base,k:"keep",label:"Keep",why:keep>0?`Keep: needed for ${keep} and you use it`:"You use it in your loadout"};
  // trade currency (Assorted Seeds and the like): traders take it in exchange for other items
  const buys=TRADE_COST[id];
  if(buys){const b=buys.slice().sort((x,y)=>short(y.it)-short(x.it));
    return{...base,k:"mat",label:"Trade",why:pre+`keep: ${b[0].tr} trades it for ${b.slice(0,3).map(t=>nm(t.it)+(short(t.it)?" (you're short)":"")).join(", ")}${b.length>3?` and ${b.length-3} more`:""}`}}
  if(it.t==="Blueprint")return{...base,k:"learn",label:"Learn",why:pre+"learn the blueprint first, sell duplicates"};
  const used=uses(id);
  if(it.t==="Key")return{...base,k:"gear",label:"Key",why:pre+(used.length?`keep: ${usesText(id)}`:"use it in a raid or sell it")};
  if(isGear(it))return{...base,k:"gear",label:"Gear",why:pre+(used.length?`${usesText(id)} · `:"")+"sell it unless it's in your loadout (mark it in the item)"};
  // crafting materials: anything a recipe, upgrade or repair takes
  if(used.length){
    if(isBasic(id)){
      if(count<=S.stockBasic)return{...base,k:"mat",label:"Material",why:pre+`keep up to ${S.stockBasic} (you have ${count}) · ${usesText(id)}`};
      const sell=count-Math.max(keep,S.stockBasic);
      return{...base,extra:sell,k:"sell",label:"Sell extra",why:`keep ${Math.max(keep,S.stockBasic)}, sell ${sell} · ${fmt(sell*(it.v||0))} creds`};
    }
    return{...base,k:"mat",label:"Material",why:pre+`keep: ${usesText(id)}`};
  }
  // recycle when it gives something you're short of
  const rc=Object.keys(it.rc||{}).filter(short);
  if(rc.length)return{...base,k:"recycle",label:"Recycle",why:pre+"recycle it for "+rc.map(m=>`${it.rc[m]}× ${nm(m)} (you have ${have(m)}${deficit(m)>0?`, need ${needTotal(m)}`:` of ${stockTarget(m)}`})`).join(", "),rc};
  const gives=Object.keys(it.rc||{});
  return{...base,k:"sell",label:"Sell",why:pre+`no quest, workshop, project or crafting use left${gives.length?` and you have enough ${gives.map(nm).join(", ")}`:""} · ${fmt(extra*(it.v||0))} creds`};
}

/* ---------- where to find ---------- */
function sources(id){
  const it=I(id),out={};
  out.zones=it.f?it.f.split(",").map(s=>s.trim()):[];
  out.bots=D.bots.filter(b=>b.drops.includes(id));
  out.from=Object.entries(D.items).map(([k,x])=>({id:k,rc:(x.rc||{})[id]||0,sv:(x.sv||{})[id]||0})).filter(x=>x.rc||x.sv).sort((a,b)=>have(b.id)-have(a.id)||b.rc-a.rc).slice(0,10);
  out.vendors=it.vd||[];
  out.trades=D.trades.filter(t=>t.it===id);
  out.quests=Object.entries(Q).filter(([,q])=>(q.rw||{})[id]).map(([k,q])=>({id:k,n:q.n,q:q.rw[id]}));
  return out;
}

  document.addEventListener("pointerup",e=>{ptrs.delete(e.pointerId);if(!drag||e.target.id!=="tmap"){drag=null;return}const moved=drag.moved;drag=null;save();if(moved>=4)return;
    const T=window.__tx,r=e.target.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top,m=S.lobbyMap,Wd=world(m);
    const wx=T.vw.cx+(cx-T.W/2)/T.sc,wy=T.vw.cy+(cy-T.H/2)/T.sc;

    const v=mapView(m);let mx,my;if(v){mx=(wx-v.a.tx)/v.a.s;my=(wy-v.a.ty)/v.a.s}else{const[x0,y0,x1]=mkFor(m).box,pad=(x1-x0)*0.04;mx=wx+x0-pad;my=wy+y0-pad}

/* ---------- scan results ---------- */
// How much of the stash this scan session has covered: slots counted vs. the game's "STASH 287/292" header.
function stashProgress(r){
  if(r.slots===undefined)return "";   // older scanner code without slot counting
  // scans saved by the previous version carry stash:{used,cap} without a category or slot count
  const st=r.stash&&{cat:r.stash.cat??(r.stash.cap?0:-1),...r.stash},n=st&&st.slots!=null?st.slots:r.slots;
  const mixed=r.mixed?`<p class="conf low" style="margin:0;font-size:13px">This scan mixes the all-items view with a category, so those items are counted twice. Press <span class="kbd">Shift</span> + <span class="kbd">F9</span> and scan either everything or category by category.</p>`:"";
  const others=(r.categories||[]).filter(c=>!st||c.cat!==st.cat).map(c=>`${c.cat===0?"All items":c.cat>0?`Category ${c.cat}`:"A category"}: ${c.slots}${c.used!=null?`/${c.used}`:""}`).join(" · ");
  const rest=others?`<p class="mono mut" style="margin:0;font-size:12px">Also in this scan: ${others}</p>`:"";
  if(!st||st.used==null)return `<p class="note" style="margin:0">${plural(n,"slot")} scanned. The stash total wasn't readable, so the app can't tell whether it's complete: keep the STASH header visible while scanning.</p>${mixed}${rest}`;
  const what=st.cat===0?"stash":"category";
  const pct=Math.min(100,Math.round(n/Math.max(1,st.used)*100)),done=n>=st.used;
  const msg=n===st.used?(st.cat===0?`Whole stash scanned: all ${st.used} occupied slots.`:`Whole category scanned: all ${st.used} items. Pick the next category and press F9.`)
    :n>st.used?`Counted ${n} slots but the ${what} holds ${st.used}: some rows were probably counted twice. Check the counts, or start a new vault scan and scroll a full page at a time.`
    :`${n} of ${st.used} ${st.cat===0?"occupied slots":"items in this category"} scanned, ${st.used-n} to go. Scroll down and press <span class="kbd">F9</span> again.`;
  return `<div class="stack" style="gap:6px"><div class="meter${done?" full":""}" role="progressbar" aria-valuemin="0" aria-valuemax="${st.used}" aria-valuenow="${Math.min(n,st.used)}" aria-label="${what} scanned"><i style="width:${pct}%"></i></div><p class="${n>st.used?"conf low":"mut"}" style="margin:0;font-size:13px">${msg}</p>${mixed}${rest}</div>`;
}
const SCAN_STAGE={capture:"Taking a screenshot of the game…",recognise:"Recognising items and text… this takes a few seconds"};
window.onScanState=s=>{
  const bar=$("#scanbar");if(!bar)return;
  if(s==="busy"){if(!bar.hidden){$("#scanbarText").textContent="Still working on the previous scan, wait for it to finish…"}return}
  bar.hidden=!s;if(s)$("#scanbarText").textContent=SCAN_STAGE[s]||"Scanning…";
};
window.onScanResult=r=>{
  if(!r){return}
  if(r.error){S.scan={kind:"error",...r};S.tab="scan";render();toast("Nothing recognised");return}
  if(r.kind==="quests"){const prev={};(S.scan&&S.scan.kind==="quests"?S.scan.quests:[]).forEach(q=>prev[q.id]=q.use);r.quests.forEach(q=>q.use=prev[q.id]??q.score>=90)}

  toast(r.kind==="quests"?`${plural(r.quests.length,"quest")} recognised`:r.kind==="vault"?(r.duplicate?"Same page as before: scroll the stash, then press F9":r.stash&&r.stash.used!=null?(r.stash.slots>=r.stash.used?`Done: ${r.stash.slots}/${r.stash.used} ${r.stash.cat===0?"stash slots":"in this category"} scanned`:`${r.stash.slots}/${r.stash.used} ${r.stash.cat===0?"stash slots":"in this category"} scanned`):`${plural(r.items.length,"item type")} recognised`):"Nothing recognised");

/* ---------- automatic reading (the desktop app watches the game by itself) ---------- */
S.auto=S.auto??true;S.qsteps=S.qsteps||{};
const AUTO_STATE={watching:"Watching the game",starting:"Starting…","game not running":"Waiting for ARC Raiders to start","game in background":"Paused: the game isn't the window in front","game minimised":"Paused: the game is minimised","capture failed":"Can't capture the game right now",off:"Off","no frame":"Watching the game"};
let autoBarT=0;
function autoBar(msg){const bar=$("#scanbar");if(!bar||!$("#scanbarText"))return;bar.hidden=false;$("#scanbarText").textContent=msg;clearTimeout(autoBarT);autoBarT=setTimeout(()=>{bar.hidden=true},3500)}
// a quest read from the game is in your log: what comes before it is done, it and what follows isn't
function addActiveQuest(id){
  snapshotDone();S.active=S.active||{};const anc=ancestors(id);
  Object.keys(S.active).forEach(a=>{if(anc.has(a))delete S.active[a]});
  S.active[id]=1;anc.forEach(a=>S.done[a]=true);delete S.done[id];descendants(id).forEach(x=>delete S.done[x]);
}
window.onAutoScan=r=>{try{autoScan(r)}catch(e){jsError("onAutoScan: "+(e&&e.stack||e))}};

function autoScan(r){
  if(!r||!S.auto)return;
  if(r.kind==="quests"){
    if(r.level){S.level=r.level;S.levelAt=Date.now()}
    const id=r.screen,q=(r.quests||[]).find(x=>x.id===id);
    if(!q||q.score<90||!Q[id]){save();return}
    const steps=q.steps||[],prev=S.qsteps[id];
    S.qsteps[id]={s:steps,at:Date.now()};
    const fresh=!(S.active&&S.active[id]);
    if(fresh)addActiveQuest(id);
    if(fresh||!prev||prev.s.join()!==steps.join())toast(`${fresh?"Quest added":"Quest updated"}: ${Q[id].n}${steps.length?` · ${steps.filter(Boolean).length}/${steps.length} steps`:""}`);
    render();return;
  }
  if(r.kind==="vault"){
    const st=r.stash;
    if(st&&st.cat===0&&st.used!=null)S.stashInfo={...(S.stashInfo||{}),used:st.used,cap:st.cap,value:r.value??(S.stashInfo||{}).value,read:st.slots,seen:Date.now()};
    if(r.duplicate){save();return}
    if(!st||st.used==null){autoBar(`Reading the stash: ${r.slots} slots`);save();return}
    if(st.cat!==0){autoBar(`Reading a stash category: ${st.slots}/${st.used}. Pick “All” to update your vault.`);save();return}
    if(st.slots<st.used){autoBar(`Reading the stash: ${st.slots}/${st.used} slots. Keep scrolling down.`);save();return}
    if((r.runs||1)>1){autoBar(`Read ${st.slots}/${st.used} slots in ${r.runs} pieces that don't join yet. Scroll through the stash once more, top to bottom.`);save();return}
    if(st.slots>st.used||r.mixed){S.scan=r;autoBar(`Read ${st.slots} slots but the stash has ${st.used}. Check it on the Scan tab.`);render();return}
    if((r.unknowns||[]).length){S.scan=r;S.tab="scan";render();toast(`Stash read. ${plural(r.unknowns.length,"item")} need a name before the vault is updated.`);return}
    S.inv={};r.items.forEach(x=>{if(x.count>0)S.inv[x.id]=x.count});
    S.stashInfo.done=Date.now();S.scan=null;save();render();
    autoBar(`Stash read: all ${st.used} slots. Vault updated.`);toast(`Vault updated from the stash: ${plural(r.items.length,"item type")}`);
  }
}

// Active quests you've confirmed by scanning are never marked done, nor anything after them.
// That matters for quests with several possible previous quests.
function questScanTarget(replace){
  const scanned=S.scan.quests.filter(q=>q.use!==false).map(q=>q.id);
  const active=new Set(replace?scanned:[...Object.keys(S.active||{}),...scanned]);
  const done=replace?{}:{...S.done};
  active.forEach(id=>ancestors(id).forEach(a=>done[a]=true));
  active.forEach(id=>{delete done[id];descendants(id).forEach(x=>delete done[x])});
  return{done,active};
}
function questScanPreview(replace){const t=questScanTarget(replace).done;return{added:Object.keys(t).filter(k=>!S.done[k]).length,undone:Object.keys(S.done).filter(k=>!t[k]).length}}
function snapshotDone(){S.doneUndo=JSON.parse(JSON.stringify({d:S.done,a:S.active||{}}))}
function applyQuests(replace){
  if(!S.scan.quests.some(q=>q.use!==false)){toast("Tick at least one quest");return}
  snapshotDone();const t=questScanTarget(replace);S.done=t.done;S.active=Object.fromEntries([...t.active].map(i=>[i,1]));
  S.scan=null;S.tab="lobby";render();toast("Quest progress updated. Undo it on the Quests tab.");
}
function descendants(id,acc=new Set()){(Q[id]?.nx||[]).forEach(n=>{if(Q[n]&&!acc.has(n)){acc.add(n);descendants(n,acc)}});return acc}
function applyVault(replace){
  if(replace)S.inv={};
  S.scan.items.forEach(x=>{if(x.count>0)S.inv[x.id]=(replace?0:(S.inv[x.id]||0))+x.count});
  S.scan=null;api()&&api().reset_vault_session();S.tab="vault";render();toast("Vault updated");
}

/* ---------- render + events ---------- */
function render(){
  computeNeeds();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  const ae=document.activeElement,aid=ae&&ae.id,pos=ae&&ae.selectionStart;
  $("#main").innerHTML=V[S.tab]();
  if(aid&&document.getElementById(aid)){const el=document.getElementById(aid);el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}
  drawTactical();
  save();
}
const BY_NAME={};Object.entries(D.items).forEach(([id,i])=>BY_NAME[i.n.toLowerCase()]=id);
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-map]");if(!t)return;const d=t.dataset;
  if(d.tab){S.tab=d.tab;try{history.replaceState(null,"","#"+d.tab)}catch(_){}render();window.scrollTo(0,0)}
  else if(d.map){S.lobbyMap=d.map;S.lobbyImg=null;render()}
  else if(d.img){S.lobbyImg=d.img;render()}
  else if(d.done){S.done[d.done]=true;if(S.active)delete S.active[d.done];render();toast("Quest done")}
  else if(d.undone){delete S.done[d.undone];render()}
  else if(d.have){S.active=S.active||{};S.active[d.have]=1;render();toast("Added to your active quests")}
  else if(d.nothave){delete S.active[d.nothave];render()}
  else if(d.doneall){snapshotDone();S.active=S.active||{};S.active[d.doneall]=1;ancestors(d.doneall).forEach(a=>S.done[a]=true);delete S.done[d.doneall];render();toast("Progress saved")}
  else if(d.qf){S.qf=d.qf;render()}
  else if(d.build){S.build=d.build;render()}
  else if(d.zoom!==undefined)window.__zoom(+d.zoom)
  else if(d.bigmap){S.bigMap=!S.bigMap;render()}
  else if(d.stella){S.stellaFloor=d.stella;render()}
  else if(d.unfocus){S.focusQ=null;render()}
  else if(d.showq){const q=d.showq,mm=QMARK[q]||{},m=Object.keys(mm).sort((a,b)=>mm[b].length-mm[a].length)[0];if(!m)return;S.focusQ=q;S.lobbyMap=m;S.tab="lobby";S.layers=S.layers||{};S.layers.quests=1;window.__focus(mm[m],m);render();window.scrollTo(0,0)}
  else if(d.layer){S.layers[d.layer]=S.layers[d.layer]?0:1;render()}
  else if(d.floor!==undefined){S.floor=+d.floor;render()}
  else if(d.showmap){S.lobbyMap=d.showmap;S.routeT=d.route;S.mapMode="tac";S.tab="lobby";$("#dlg").close();render()}

  else if(d.vf){S.vf=d.vf;render()}
  else if(d.vcat){S.vcat=d.vcat;S.vf="all";render()}
  else if(d.learnas){const [key,id]=d.learnas.split("|");if(!api()){toast("Learning works in the desktop app");return}
    api().learn(key,id).then(res=>{if(res){S.scan={...S.scan,...res};render();toast(`Saved as ${nm(id)}. It's recognised from now on.`)}})}
  else if(d.del){setQty(d.del,0);render()}
  else if(d.unpin!==undefined){const k=S.lobbyImg||(QMAP_TO_IMG[S.lobbyMap]||[S.lobbyMap])[0];S.pins[k].splice(+d.unpin,1);render()}
  else if(t.id==="addBtn")addItem();
  else if(t.id==="sampleInv"){Object.assign(S.inv,{rusted_gear:6,metal_parts:40,fabric:12,plastic_parts:30,dusty_film_reel:1,acoustic_guitar:1,advanced_arc_powercell:2,wasp_driver:3,adrenaline_shot:5,shotgun_silencer_blueprint:1,air_freshener:2,cat_bed:1,coffee_pot:1});render();toast("Example vault loaded")}
  else if(t.id==="clearInv"){if(t.dataset.arm){S.inv={};render()}else{t.dataset.arm=1;t.textContent="Clear everything?"}}
  else if(t.id==="bkExport"){$("#bk").value=JSON.stringify({inv:S.inv,done:S.done,hide:S.hide,proj:S.proj,projT:S.projT,projGiven:S.projGiven,future:S.future,pins:S.pins})}
  else if(t.id==="bkCopy"){const v=$("#bk").value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast("Copied"),()=>{$("#bk").select()})}
  else if(t.id==="bkImport"){try{Object.assign(S,JSON.parse($("#bk").value));render();toast("Backup restored")}catch(_){toast("That backup isn't valid JSON")}}
  else if(t.id==="scanNow"&&api()){api().scan_screen().then(window.onScanResult,()=>window.onScanState(null))}
  else if(t.id==="scanFile"&&api()){api().scan_file().then(window.onScanResult)}
  else if(t.id==="scanReset"&&api()){api().reset_vault_session().then(()=>toast("New vault scan started. Scan each vault page with F9."))}
  else if(t.id==="actAddBtn")addActive();
  else if(t.id==="actAll"){const act=Object.keys(S.active||{}).filter(id=>Q[id]);snapshotDone();const keep=new Set(act);act.forEach(id=>descendants(id).forEach(x=>keep.add(x)));
    Object.keys(Q).forEach(id=>{if(!keep.has(id)&&!(needsConfirm(id)&&!S.done[id]))S.done[id]=true});S.qf="mine";render();toast("Progress set from your quest log")}
  else if(d.actdel){const ids=Object.keys(S.active||{}).filter(i=>i!==d.actdel);snapshotDone();delete S.active[d.actdel];
    // drop the quests that were only marked done because of the removed one
    const keep=new Set();ids.forEach(i=>ancestors(i).forEach(a=>keep.add(a)));ancestors(d.actdel).forEach(a=>{if(!keep.has(a))delete S.done[a]});render()}
  else if(d.learn){const v=($("#lk_"+d.learn)?.value||"").trim().toLowerCase();const id=BY_NAME[v]||Object.keys(D.items).find(k=>D.items[k].n.toLowerCase().startsWith(v));
    if(!v||!id){toast("Pick an item from the list");return}
    if(!api()){toast("Learning works in the desktop app");return}
    api().learn(d.learn,id).then(res=>{if(res){S.scan={...S.scan,...res};render();toast(`Saved as ${nm(id)}. It's recognised from now on.`)}})}
  else if(d.fixopen!==undefined){const id=S.scan.items[+d.fixopen].id;S.scanFix=S.scanFix===id?null:id;render()}
  else if(d.fix){const [i,j]=d.fix.split("_").map(Number),x=S.scan.items[i],vr=x.variants[j];
    const v=($("#fx_"+d.fix)?.value||"").trim().toLowerCase();const id=BY_NAME[v]||Object.keys(D.items).find(k=>D.items[k].n.toLowerCase().startsWith(v));
    if(!v||!id){toast("Pick an item from the list");return}
    if(id===x.id){toast("That's what it was already read as");return}
    if(!api()){toast("Corrections work in the desktop app");return}
    api().reassign(x.id,vr.key,id).then(res=>{if(res){S.scan={...S.scan,...res};S.scanFix=null;render();toast(`Moved to ${nm(id)}. That picture is recognised from now on.`)}})}
  else if(t.id==="applyQuests")applyQuests(true);
  else if(t.id==="applyQuestsAdd")applyQuests(false);
  else if(t.id==="openScans"&&api())api().open_scans_folder();
  else if(t.id==="undoQuests"&&S.doneUndo){const u=S.doneUndo;S.done=u.d||u;S.active=u.a||S.active||{};S.doneUndo=null;render();toast("Quest progress restored")}
  else if(t.id==="resetQuests"){if(t.dataset.arm){snapshotDone();S.done={};S.active={};render();toast("All quests reset. Undo is available.")}else{t.dataset.arm=1;t.textContent="Reset every quest?"}}
  else if(d.undoneafter){snapshotDone();delete S.done[d.undoneafter];descendants(d.undoneafter).forEach(x=>delete S.done[x]);render();toast("Reset this quest and everything after it")}
  else if(t.id==="applyVaultReplace")applyVault(true);
  else if(t.id==="applyVaultAdd")applyVault(false);
  else if(t.id==="dropScan"){S.scan=null;render()}
});
function addItem(){const n=$("#addName").value.trim().toLowerCase();const id=BY_NAME[n]||Object.keys(D.items).find(k=>D.items[k].n.toLowerCase().startsWith(n));
  if(!n||!id){toast("No item with that name");return}setQty(id,have(id)+Math.max(1,+$("#addQty").value||1));$("#addName").value="";render();$("#addName").focus();toast(`Added ${nm(id)}`)}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="addName")addItem();if(e.key==="Enter"&&e.target.id==="actAdd")addActive()});
function addActive(){const v=($("#actAdd").value||"").trim().toLowerCase();if(!v)return;
  const id=Object.keys(Q).find(k=>Q[k].n.toLowerCase()===v)||Object.keys(Q).find(k=>Q[k].n.toLowerCase().startsWith(v))||Object.keys(Q).find(k=>Q[k].n.toLowerCase().includes(v));
  if(!id){toast("No quest with that name");return}
  setActive([...new Set([...Object.keys(S.active||{}),id])]);S.qf="mine";render();$("#actAdd")?.focus();toast(`Added ${Q[id].n}`)}
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
  if(d.qty){setQty(d.qty,+t.value);render()}
  else if(d.stock){S[d.stock]=Math.max(0,Math.round(+t.value||0));render()}
  else if(d.use){S.use=S.use||{};if(t.checked)S.use[d.use]=1;else delete S.use[d.use];save();openItem(d.use)}
  else if(d.scanq!==undefined){S.scan.quests[+d.scanq].use=t.checked;render()}
  else if(d.scancount!==undefined){S.scan.items[+d.scancount].count=Math.max(0,+t.value||0);save()}
  else if(d.hide){S.hide[d.hide]=+t.value;render()}
  else if(d.proj){S.proj[d.proj]=+t.value;S.projGiven[d.proj]={};render()}
  else if(d.projt){if(t.checked){S.projT[d.projt]=1;S.projOpen[d.projt]=1}else delete S.projT[d.projt];render()}
  else if(d.given){const [pid,it]=d.given.split("|"),p=D.projects[pid],n=p.ph[S.proj[pid]||0]?.req[it]||0;
    (S.projGiven[pid]=S.projGiven[pid]||{})[it]=Math.max(0,Math.min(n,Math.round(+t.value||0)));render()}
  else if(t.id==="optFuture"){S.future=t.checked;render()}
  else if(t.id==="optMarks"){S.marks=t.checked;api()&&api().set_marks&&api().set_marks(S.marks);save()}
  else if(t.id==="optAuto"){S.auto=t.checked;api()&&api().set_auto&&api().set_auto(S.auto);render()}
  else if(t.id==="pinQ"){S.pinQ=t.value;save()}
  else if(t.id==="routeT"){S.routeT=t.value;render()}
  else if(t.id==="showRoute"){S.showRoute=t.checked;render()}
  else if(t.id==="it"){S.it=t.value;render()}
  else if(t.id==="skPtsN"||t.id==="skPts"){S.skillPts=+t.value;render()}
});
// ARC Tracker map links: in the desktop app they open in the overlay's own map window
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[data-atmap]");if(!a||!api()||!api().open_map)return;
  e.preventDefault();e.stopPropagation();api().open_map(a.href).then(ok=>{if(!ok)toast("Couldn't open the map")})},true);
document.addEventListener("toggle",e=>{const id=e.target.dataset&&e.target.dataset.projopen;if(id){if(e.target.open)S.projOpen[id]=1;else delete S.projOpen[id];save()}},true);
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="skPts"){const n=$("#skPtsN");if(n)n.value=t.value}
  else if(t.id==="qs"){S.qs=t.value;render()} else if(t.id==="is"){S.is=t.value;render()}});
window.addEventListener("resize",()=>drawTactical());
document.addEventListener("click",e=>{const box=e.target.closest("#mapbox");if(!box)return;
  const r=box.getBoundingClientRect();const x=((e.clientX-r.left)/r.width*100).toFixed(2),y=((e.clientY-r.top)/r.height*100).toFixed(2);
  const k=S.lobbyImg||(QMAP_TO_IMG[S.lobbyMap]||[S.lobbyMap])[0];const q=$("#pinQ")?.value||"";
  (S.pins[k]=S.pins[k]||[]).push({x:+x,y:+y,q,l:q?"":"marker"});render()});
document.addEventListener("toggle",e=>{if(e.target.id==="skOrderBox"){S.skOrder=e.target.open;save()}
  const gid=e.target.dataset&&e.target.dataset.g;if(gid){S.gOpen=S.gOpen||{};const was=!!S.gOpen[gid];if(e.target.open)S.gOpen[gid]=1;else delete S.gOpen[gid];save();if(e.target.open&&!was)render()}},true);
{const m=D.meta;if(m)$("#foot").innerHTML=`Data updated ${esc(new Date(m.built).toLocaleString())} from ${m.sources.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.n)}</a> (${esc(x.what)})`).join(", ")}. Not affiliated with Embark Studios.`}
window.addEventListener("pywebviewready",()=>{DESK=true;document.body.classList.add("desk");render();
  try{api().app_info().then(i=>{if(!i)return;const f=$("#foot");const up={updated:"just updated",current:"up to date",unreachable:"couldn't reach GitHub",failed:"update failed",new_exe_needed:"new .exe needed",skipped:"update skipped"}[i.update]||i.update||"";
    if(f&&!$("#appver"))f.insertAdjacentHTML("afterbegin",`<span class="mono" id="appver">App ${esc(i.app)} · data version ${esc(i.code)}${up?` · ${esc(up)}`:""}${i.update_error?` (${esc(String(i.update_error).slice(0,140))})`:""}</span><br>`);
    if(i.new_app&&!$("#newapp")){const m=$("#main");if(m)m.insertAdjacentHTML("afterbegin",`<div class="panel row" id="newapp" style="justify-content:space-between;margin-bottom:12px;border-color:var(--accent)"><span>A new version of the app is available.</span><a class="btn pri" href="${esc(i.new_app)}" target="_blank" rel="noopener">Download it</a></div>`)}})}catch(e){}});
const h=(location.hash||"").slice(1);if(V[h])S.tab=h;
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(V[h]&&h!==S.tab){S.tab=h;render()}});
render();
</script>
