name: Build Windows overlay
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        run: build_windows.bat
      - name: Synthetic scanner test
        run: python tests/test_scanner.py data/arcraiders-data
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        with:
          name: RaiderLogbook-windows
          path: release/RaiderLogbook
